<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母亲节快乐 - 致最爱的妈妈</title>
    <style>
        :root {
            --pink-deep: #e8a0b4;
            --pink-mid: #f2c4d0;
            --pink-light: #fbe8ee;
            --pink-pale: #fff5f7;
            --champagne: #f7efe5;
            --champagne-light: #fdf8f2;
            --white: #fffdfc;
            --text-dark: #5c3d4a;
            --text-mid: #8b6b78;
            --text-light: #b8959f;
            --gold: #d4b896;
            --gold-light: #ead5be;
            --shadow-soft: 0 4px 20px rgba(180, 140, 150, 0.2);
            --shadow-card: 0 8px 40px rgba(160, 120, 135, 0.25);
            --shadow-glow: 0 0 30px rgba(232, 160, 180, 0.4);
            --font-cn: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'STSong', 'Noto Serif SC', serif;
            --font-en: 'Georgia', 'Times New Roman', 'Palatino Linotype', 'Book Antiqua', serif;
            --transition-gentle: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-card: 1.2s cubic-bezier(0.22, 0.61, 0.36, 1);
            --transition-burst: 0.8s cubic-bezier(0.1, 0.8, 0.2, 1.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-cn);
            background: linear-gradient(170deg, #fdf6f0 0%, #fef9fc 25%, #fdf5f7 50%, #fef8f4 75%, #fdf6f8 100%);
            background-attachment: fixed;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            cursor: default;
        }

        .particles-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
            box-shadow: 0 0 6px 2px rgba(255, 220, 200, 0.8), 0 0 12px 4px rgba(255, 200, 180, 0.4);
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                opacity: 0.2;
                transform: translateY(0) scale(1);
            }
            25% {
                opacity: 1;
                transform: translateY(-30px) scale(1.8);
            }
            50% {
                opacity: 0.5;
                transform: translateY(-15px) scale(1.2);
            }
            75% {
                opacity: 0.9;
                transform: translateY(-35px) scale(1.6);
            }
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 18px;
            animation: heartFall linear forwards;
            opacity: 0;
            filter: blur(0.5px);
        }
        @keyframes heartFall {
            0% {
                opacity: 0;
                transform: translateY(-60px) translateX(0) rotate(0deg) scale(0.5);
            }
            8% {
                opacity: 0.7;
            }
            60% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) translateX(80px) rotate(360deg) scale(1.2);
            }
        }

        .petal-bg {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: petalDrift linear forwards;
            opacity: 0;
        }
        @keyframes petalDrift {
            0% {
                opacity: 0;
                transform: translateY(-40px) translateX(0) rotate(0deg) scale(0.6);
            }
            10% {
                opacity: 0.65;
            }
            70% {
                opacity: 0.4;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) translateX(120px) rotate(540deg) scale(1);
            }
        }

        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            perspective: 1800px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: auto;
        }
        .page.page-1 {
            z-index: 20;
            opacity: 1;
            transform: scale(1);
        }
        .page.page-2 {
            z-index: 15;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .page.page-1.hidden {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            z-index: 5;
        }
        .page.page-2.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            z-index: 25;
        }

        .card-wrapper {
            position: relative;
            perspective: 2000px;
            width: 90vw;
            max-width: 520px;
            height: 70vh;
            max-height: 620px;
            min-height: 420px;
            cursor: pointer;
        }
        .card-wrapper.opened {
            cursor: default;
        }

        .card-3d {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform var(--transition-card);
        }
        .card-wrapper.opened .card-3d {
            transform: rotateX(-175deg);
        }

        .card-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: linear-gradient(160deg, #fefefe 0%, #fdf5f8 30%, #fef7f3 60%, #fef9f6 100%);
            box-shadow: var(--shadow-card), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            overflow: hidden;
            transform-origin: top center;
            border: 2px solid rgba(232, 180, 195, 0.3);
        }
        .card-cover::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 12px;
            border: 1.5px dashed rgba(210, 170, 180, 0.35);
            pointer-events: none;
            z-index: 1;
        }
        .card-cover::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35%;
            background: linear-gradient(to top, rgba(245, 220, 210, 0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
            border-radius: 0 0 20px 20px;
        }
        .cover-texture {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            background-image: radial-gradient(circle, rgba(210, 170, 180, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
            border-radius: 20px;
        }

        .cover-crease {
            position: absolute;
            top: 46%;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 140, 150, 0.5) 20%, rgba(180, 140, 150, 0.6) 50%, rgba(180, 140, 150, 0.5) 80%, transparent);
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 1px 2px rgba(180, 140, 150, 0.15);
        }
        .cover-crease::after {
            content: '✧';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(190, 150, 160, 0.55);
            background: #fef9f6;
            padding: 0 10px;
            letter-spacing: 2px;
        }

        .bouquet-on-cover {
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bouquetFloat 3.5s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .bouquet-on-cover:hover {
            transform: scale(1.06);
        }
        @keyframes bouquetFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-4px);
            }
            85% {
                transform: translateY(-8px);
            }
        }
        .bouquet-on-cover:active {
            transform: scale(0.96);
            transition: transform 0.15s ease;
        }

        .carnation-bouquet {
            position: relative;
            width: 160px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stems {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 0;
        }
        .stem {
            width: 3px;
            height: 80px;
            background: linear-gradient(to top, #7a9a6b, #9bba8a, #b5d1a3);
            border-radius: 2px;
            position: relative;
        }
        .stem:nth-child(1) {
            height: 75px;
            transform: rotate(-8deg);
        }
        .stem:nth-child(2) {
            height: 85px;
        }
        .stem:nth-child(3) {
            height: 78px;
            transform: rotate(8deg);
        }
        .stem:nth-child(4) {
            height: 70px;
            transform: rotate(-3deg);
        }
        .stem:nth-child(5) {
            height: 82px;
            transform: rotate(5deg);
        }
        .leaf {
            position: absolute;
            width: 22px;
            height: 12px;
            background: #a3c696;
            border-radius: 50% 5px 50% 5px;
            z-index: -1;
            transform: rotate(-30deg);
        }
        .leaf.l1 {
            bottom: 50px;
            left: -8px;
            transform: rotate(-40deg);
        }
        .leaf.l2 {
            bottom: 55px;
            right: -6px;
            transform: rotate(35deg) scaleX(-1);
        }
        .leaf.l3 {
            bottom: 38px;
            left: 2px;
            transform: rotate(-25deg);
            width: 18px;
            height: 10px;
        }

        .carnation-flower {
            position: absolute;
            z-index: 2;
            animation: flowerSway 4s ease-in-out infinite;
        }
        @keyframes flowerSway {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(1.5deg);
            }
            75% {
                transform: rotate(-1.5deg);
            }
        }
        .carnation-flower.f1 {
            top: 10px;
            left: 25px;
            animation-delay: 0s;
        }
        .carnation-flower.f2 {
            top: 0px;
            left: 58px;
            animation-delay: 0.6s;
            transform: scale(1.08);
        }
        .carnation-flower.f3 {
            top: 18px;
            left: 90px;
            animation-delay: 1.2s;
            transform: scale(0.9);
        }
        .carnation-flower.f4 {
            top: 35px;
            left: 42px;
            animation-delay: 0.3s;
            transform: scale(0.78);
            z-index: 1;
        }
        .carnation-flower.f5 {
            top: 28px;
            left: 72px;
            animation-delay: 0.9s;
            transform: scale(0.85);
            z-index: 1;
        }

        .flower-head {
            position: relative;
            width: 48px;
            height: 48px;
        }
        .petal-layer {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse at 35% 30%, #fde2e8 0%, #f0b8c8 40%, #e895aa 70%, #d47890 100%);
            box-shadow: inset 0 -4px 8px rgba(180, 100, 120, 0.35), 0 2px 6px rgba(200, 140, 155, 0.3);
        }
        .petal-layer.pl1 {
            width: 48px;
            height: 48px;
            top: 0;
            left: 0;
            z-index: 3;
            border-radius: 48% 52% 45% 55%;
        }
        .petal-layer.pl2 {
            width: 40px;
            height: 40px;
            top: 4px;
            left: 4px;
            z-index: 4;
            border-radius: 55% 45% 50% 50%;
            background: radial-gradient(ellipse at 40% 28%, #fff0f4 0%, #f5c4d4 35%, #eaa0b5 65%, #d88598 100%);
        }
        .petal-layer.pl3 {
            width: 30px;
            height: 30px;
            top: 9px;
            left: 9px;
            z-index: 5;
            border-radius: 50% 48% 52% 50%;
            background: radial-gradient(ellipse at 38% 25%, #fff5f7 0%, #fbd5e0 30%, #f0aec0 60%, #e290a5 100%);
            box-shadow: inset 0 -2px 5px rgba(170, 90, 110, 0.3);
        }
        .petal-layer.pl4 {
            width: 18px;
            height: 18px;
            top: 15px;
            left: 15px;
            z-index: 6;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #fffafb 0%, #fde8ee 50%, #f0b8c8 100%);
            box-shadow: 0 1px 3px rgba(190, 130, 145, 0.25);
        }
        .flower-head::after {
            content: '';
            position: absolute;
            width: 44px;
            height: 44px;
            top: 2px;
            left: 2px;
            z-index: 7;
            border-radius: 46% 54% 48% 52%;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: petalShimmer 3s ease-in-out infinite;
        }
        @keyframes petalShimmer {
            0%,
            100% {
                border-color: rgba(255, 255, 255, 0.3);
            }
            50% {
                border-color: rgba(255, 255, 255, 0.6);
            }
        }

        .sepal {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 10px;
            background: #8aab7a;
            border-radius: 40% 40% 20% 20%;
            z-index: 0;
        }

        .wrapping {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 55px;
            z-index: -1;
            background: linear-gradient(180deg, rgba(250, 240, 235, 0.9) 0%, rgba(245, 225, 215, 0.85) 100%);
            border-radius: 10px 10px 30px 30px;
            box-shadow: 0 4px 12px rgba(180, 150, 140, 0.25);
            border: 1px solid rgba(220, 190, 175, 0.5);
        }
        .wrapping::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -5px;
            right: -5px;
            height: 20px;
            background: linear-gradient(180deg, rgba(252, 245, 240, 0.95) 0%, rgba(248, 235, 225, 0.9) 100%);
            border-radius: 40% 40% 10px 10px;
            border: 1px solid rgba(220, 190, 175, 0.4);
        }
        .wrapping-ribbon {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 28px;
            z-index: 1;
            background: linear-gradient(180deg, #f0d5c8, #e8c8b8, #f0d5c8);
            border-radius: 3px;
            box-shadow: 0 2px 4px rgba(180, 140, 125, 0.3);
        }
        .wrapping-ribbon::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(3px);
        }

        .cover-title {
            z-index: 5;
            margin-top: 8px;
            font-family: var(--font-en);
            font-size: 1.2rem;
            color: var(--text-mid);
            letter-spacing: 2px;
            font-weight: 400;
            text-align: center;
            opacity: 0.8;
            transition: all 0.4s ease;
        }
        .cover-subtitle {
            z-index: 5;
            font-family: var(--font-cn);
            font-size: 0.85rem;
            color: var(--text-light);
            letter-spacing: 1.5px;
            margin-top: 2px;
            opacity: 0.6;
            animation: subtitlePulse 2.5s ease-in-out infinite;
        }
        @keyframes subtitlePulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.9;
            }
        }

        .card-inside {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: linear-gradient(165deg, #fffefd 0%, #fefaf9 20%, #fffdfb 50%, #fef9f7 80%, #fffefd 100%);
            box-shadow: var(--shadow-card), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
            transform: rotateX(180deg);
            padding: 30px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            z-index: 1;
            border: 2px solid rgba(232, 180, 195, 0.25);
            scrollbar-width: thin;
            scrollbar-color: rgba(210, 170, 180, 0.4) transparent;
        }
        .card-inside::-webkit-scrollbar {
            width: 4px;
        }
        .card-inside::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }
        .card-inside::-webkit-scrollbar-thumb {
            background: rgba(210, 170, 180, 0.4);
            border-radius: 4px;
        }

        .inside-header {
            font-family: var(--font-en);
            font-size: 1.6rem;
            color: #d48598;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 8px;
            font-weight: 400;
            text-shadow: 0 0 20px rgba(220, 150, 170, 0.4);
        }
        .inside-divider {
            width: 60px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #e0bcc6, transparent);
            margin: 6px auto 14px;
            border-radius: 1px;
        }
        .inside-text-container {
            flex: 1;
            width: 100%;
            text-align: center;
            font-family: var(--font-cn);
            color: var(--text-dark);
            font-size: 1rem;
            line-height: 2;
            letter-spacing: 0.8px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .typed-line {
            display: block;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 8px rgba(200, 150, 165, 0.2);
        }
        .typed-line.visible {
            opacity: 1;
        }
        .typed-line.glow {
            text-shadow: 0 0 16px rgba(220, 150, 170, 0.55), 0 0 4px rgba(255, 200, 210, 0.5);
            animation: textGlowPulse 2.5s ease-in-out infinite;
        }
        @keyframes textGlowPulse {
            0%,
            100% {
                text-shadow: 0 0 14px rgba(220, 150, 170, 0.4), 0 0 4px rgba(255, 200, 210, 0.4);
            }
            50% {
                text-shadow: 0 0 24px rgba(230, 155, 175, 0.7), 0 0 8px rgba(255, 210, 220, 0.6);
            }
        }

        .photo-frame {
            width: 70%;
            max-width: 200px;
            aspect-ratio: 1;
            border-radius: 16px;
            border: 3px solid rgba(220, 180, 190, 0.5);
            margin: 10px auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #fef8f9, #fdf0f3, #fef6f8);
            box-shadow: 0 6px 24px rgba(180, 140, 155, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .photo-frame .placeholder-icon {
            font-size: 42px;
            opacity: 0.5;
            color: #d4b8c2;
            pointer-events: none;
            animation: iconFloat 4s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 13px;
        }
        .photo-frame::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 13px;
            box-shadow: inset 0 0 30px rgba(255, 220, 210, 0.3);
            pointer-events: none;
        }

        .next-btn-bouquet {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 12px;
            transition: transform 0.35s ease;
            z-index: 10;
            flex-shrink: 0;
            animation: btnFloat 3s ease-in-out infinite;
        }
        @keyframes btnFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-7px);
            }
        }
        .next-btn-bouquet:hover {
            transform: scale(1.08) translateY(-4px);
            animation: none;
        }
        .next-btn-bouquet:active {
            transform: scale(0.94);
            transition: transform 0.12s ease;
        }
        .mini-bouquet {
            position: relative;
            width: 50px;
            height: 60px;
        }
        .mini-flower {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(ellipse at 35% 28%, #fde4ea, #f0bcc8 50%, #e89aae 100%);
            box-shadow: 0 2px 6px rgba(190, 130, 145, 0.3);
        }
        .mini-flower.mf1 {
            top: 0;
            left: 8px;
        }
        .mini-flower.mf2 {
            top: -3px;
            left: 20px;
            transform: scale(0.85);
        }
        .mini-flower.mf3 {
            top: 4px;
            left: 2px;
            transform: scale(0.7);
            z-index: -1;
        }
        .mini-stem {
            position: absolute;
            width: 2px;
            height: 30px;
            background: #9bba8a;
            bottom: 5px;
            border-radius: 1px;
        }
        .mini-stem.ms1 {
            left: 18px;
        }
        .mini-stem.ms2 {
            left: 28px;
            height: 26px;
            bottom: 3px;
        }
        .mini-wrap {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 18px;
            background: rgba(248, 235, 225, 0.85);
            border-radius: 4px 4px 12px 12px;
        }
        .next-label {
            font-family: var(--font-cn);
            font-size: 0.7rem;
            color: var(--text-light);
            letter-spacing: 1px;
            margin-top: 2px;
            opacity: 0.7;
        }

        .page2-content {
            position: relative;
            width: 90vw;
            max-width: 600px;

    <script>
        (function() {
            const cardWrapper = document.getElementById('cardWrapper');
            const card3d = document.getElementById('card3d');
            const cardCover = document.getElementById('cardCover');
            const bouquetOnCover = document.getElementById('bouquetOnCover');
            const cardInside = document.getElementById('cardInside');
            const insideText = document.getElementById('insideText');
            const nextBtn = document.getElementById('nextBtn');
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const page2Text = document.getElementById('page2Text');
            const page2Signature = document.getElementById('page2Signature');
            const backHint = document.getElementById('backHint');
            const musicToggle = document.getElementById('musicToggle');
            const particlesLayer = document.getElementById('particlesLayer');
            const photoFrame = document.getElementById('photoFrame');

            let isCardOpen = false;
            let isPage2Active = false;
            let isMusicPlaying = false;
            let audioCtx = null;
            let musicInterval = null;
            let typingTimeouts = [];
            let burstPetals = [];

            function createSparkles() {
                const count = 35;
                for (let i = 0; i < count; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.animationDelay = Math.random() * 4 + 's';
                    sparkle.style.animationDuration = (2.5 + Math.random() * 4) + 's';
                    sparkle.style.width = (2 + Math.random() * 3) + 'px';
                    sparkle.style.height = sparkle.style.width;
                    particlesLayer.appendChild(sparkle);
                }
            }
            createSparkles();

            function spawnHeart() {
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                heart.textContent = ['💕', '💖', '💗', '🩷', '💝', '🌸', '✨'][Math.floor(Math.random() * 7)];
                heart.style.left = Math.random() * 95 + '%';
                heart.style.top = -(20 + Math.random() * 40) + 'px';
                heart.style.fontSize = (14 + Math.random() * 22) + 'px';
                heart.style.animationDuration = (8 + Math.random() * 12) + 's';
                heart.style.animationDelay = '0s';
                document.body.appendChild(heart);
                heart.addEventListener('animationend', () => heart.remove());
            }
            setInterval(() => {
                if (document.body.querySelectorAll('.floating-heart').length < 12) {
                    spawnHeart();
                }
            }, 1800);
            for (let i = 0; i < 6; i++) {
                setTimeout(spawnHeart, i * 400);
            }

            function spawnBgPetal() {
                const petal = document.createElement('span');
                petal.className = 'petal-bg';
                petal.textContent = ['🌸', '🌷', '💮', '🏵️', '🌺'][Math.floor(Math.random() * 5)];
                petal.style.left = Math.random() * 95 + '%';
                petal.style.top = -(15 + Math.random() * 30) + 'px';
                petal.style.fontSize = (12 + Math.random() * 20) + 'px';
                petal.style.animationDuration = (10 + Math.random() * 15) + 's';
                petal.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(petal);
                petal.addEventListener('animationend', () => petal.remove());
            }
            setInterval(() => {
                if (document.body.querySelectorAll('.petal-bg').length < 8) {
                    spawnBgPetal();
                }
            }, 2500);
            for (let i = 0; i < 5; i++) {
                setTimeout(spawnBgPetal, i * 600);
            }

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playNote(freq, startTime, duration, vol = 0.12) {
                if (!audioCtx) return;
                const now = audioCtx.currentTime + startTime;
                const osc1 = audioCtx.createOscillator();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(freq, now);
                osc1.frequency.linearRampToValueAtTime(freq * 0.998, now + duration);
                const gain1 = audioCtx.createGain();
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(vol, now + 0.08);
                gain1.gain.exponentialRampToValueAtTime(vol * 0.5, now + duration * 0.4);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + duration + 0.1);
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2, now);
                const gain2 = audioCtx.createGain();
                gain2.gain.setValueAtTime(0, now);
                gain2.gain.linearRampToValueAtTime(vol * 0.35, now + 0.04);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.6);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now);
                osc2.stop(now + duration + 0.1);
            }

            function playMelody() {
                if (!audioCtx || !isMusicPlaying) return;
                const melody = [
                    { freq: 261.63, dur: 1.2 }, { freq: 329.63, dur: 0.8 }, { freq: 392.00, dur: 1.0 },
                    { freq: 349.23, dur: 0.7 }, { freq: 293.66, dur: 0.9 }, { freq: 261.63, dur: 1.3 },
                    { freq: 392.00, dur: 0.8 }, { freq: 440.00, dur: 0.9 }, { freq: 392.00, dur: 1.1 },
                    { freq: 349.23, dur: 0.7 }, { freq: 329.63, dur: 1.0 }, { freq: 293.66, dur: 1.4 },
                    { freq: 261.63, dur: 1.0 }, { freq: 293.66, dur: 0.6 }, { freq: 329.63, dur: 0.8 },
                    { freq: 349.23, dur: 1.1 }, { freq: 392.00, dur: 1.2 }, { freq: 349.23, dur: 0.9 },
                    { freq: 329.63, dur: 1.0 }, { freq: 261.63, dur: 1.6 },
                ];
                let timeOffset = 0;
                melody.forEach(note => {
                    playNote(note.freq, timeOffset, note.dur, 0.1);
                    timeOffset += note.dur + 0.15;
                });
                const loopDuration = (timeOffset + 1) * 1000;
                if (musicInterval) clearTimeout(musicInterval);
                musicInterval = setTimeout(() => {
                    if (isMusicPlaying) playMelody();
                }, loopDuration);
            }

            function startMusic() {
                if (isMusicPlaying) return;
                initAudio();
                isMusicPlaying = true;
                musicToggle.classList.remove('muted');
                musicToggle.querySelector('.note-icon').textContent = '🎵';
                playMelody();
            }

            function stopMusic() {
                isMusicPlaying = false;
                musicToggle.classList.add('muted');
                musicToggle.querySelector('.note-icon').textContent = '🔇';
                if (musicInterval) clearTimeout(musicInterval);
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
            }

            function toggleMusic(e) {
                e.stopPropagation();
                if (isMusicPlaying) {
                    stopMusic();
                } else {
                    startMusic();
                }
            }
            musicToggle.addEventListener('click', toggleMusic);

            function typeTextLines(container, lines, startDelay = 0, onComplete = null) {
                typingTimeouts.forEach(t => clearTimeout(t));
                typingTimeouts = [];
                container.innerHTML = '';
                let totalDelay = startDelay;
                lines.forEach((line, lineIndex) => {
                    const lineEl = document.createElement('span');
                    lineEl.className = 'typed-line';
                    container.appendChild(lineEl);
                    const chars = [...line];
                    chars.forEach((char, charIndex) => {
                        const t = setTimeout(() => {
                            lineEl.textContent += char;
                            if (charIndex === 0) lineEl.classList.add('visible');
                            if (charIndex === chars.length - 1 && lineIndex === lines.length - 1) {
                                lineEl.classList.add('glow');
                                if (onComplete) {
                                    const ct = setTimeout(onComplete, 600);
                                    typingTimeouts.push(ct);
                                }
                            }
                        }, totalDelay + charIndex * 80 + lineIndex * 350);
                        typingTimeouts.push(t);
                    });
                    totalDelay += chars.length * 80 + 400;
                });
                return totalDelay;
            }

            function openCard() {
                if (isCardOpen) return;
                isCardOpen = true;
                if (!isMusicPlaying) startMusic();
                initAudio();
                cardWrapper.classList.add('opened');
                bouquetOnCover.style.pointerEvents = 'none';
                cardCover.style.pointerEvents = 'none';
                const insideLines = [
                    '母亲节快乐，亲爱的妈妈。',
                    '这一年你生病辛苦了，',
                    '谢谢你一直那么坚强，',
                    '哪怕自己难受，也总想着不让我们担心。',
                    '谢谢你一直毫无保留地爱我和王梓琪、',
                    '包容我们，把最好的都留给我们。',
                    '希望你往后都平平安安的，',
                    '不用总操心家里和我们的事，',
                    '每天轻松自在、开开心心，',
                    '一定要好好爱自己。',
                    '你陪我慢慢长大，',
                    '我陪你慢慢变老，',
                    '永远爱你。',
                ];
                const totalTypingTime = typeTextLines(insideText, insideLines, 800, () => {
                    nextBtn.style.display = 'flex';
                    nextBtn.style.opacity = '0';
                    nextBtn.style.transition = 'opacity 0.8s ease';
                    requestAnimationFrame(() => {
                        nextBtn.style.opacity = '1';
                    });
                });
                const btnShowDelay = Math.max(totalTypingTime - 600, 1500);
                const btnTimer = setTimeout(() => {
                    if (isCardOpen && nextBtn.style.display === 'none') {
                        nextBtn.style.display = 'flex';
                        nextBtn.style.opacity = '0';
                        nextBtn.style.transition = 'opacity 0.8s ease';
                        requestAnimationFrame(() => {
                            nextBtn.style.opacity = '1';
                        });
                    }
                }, btnShowDelay);
                typingTimeouts.push(btnTimer);
            }

            cardCover.addEventListener('click', openCard);
            bouquetOnCover.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!isCardOpen) openCard();
            });
            cardWrapper.addEventListener('click', (e) => {
                if (!isCardOpen && e.target === cardWrapper) openCard();
            });

            function burstPetalsEffect(centerX, centerY) {
                const petalCount = 70;
                const petalChars = ['🌸', '🌷', '💮', '🏵️', '🌺', '💐', '🌼', '✿', '❀', '🌹'];
                for (let i = 0; i < petalCount; i++) {
                    const petal = document.createElement('span');
                    petal.className = 'burst-petal';
                    petal.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
                    petal.style.position = 'fixed';
                    petal.style.left = centerX + 'px';
                    petal.style.top = centerY + 'px';
                    petal.style.fontSize = (16 + Math.random() * 28) + 'px';
                    petal.style.zIndex = '30';
                    petal.style.pointerEvents = 'none';
                    const angle = Math.random() * Math.PI * 2;
                    const dist1 = 80 + Math.random() * 200;
                    const dist2 = dist1 + Math.random() * 150;
                    const dist3 = dist1 * 0.6 + Math.random() * 80;
                    const bx = Math.cos(angle) * dist1;
                    const by = Math.sin(angle) * dist1 - Math.random() * 60;
                    const cx = Math.cos(angle + (Math.random() - 0.5) * 0.6) * dist2;
                    const cy = Math.sin(angle + (Math.random() - 0.5) * 0.6) * dist2 + 40;
                    const dx = Math.cos(angle + (Math.random() - 0.5) * 1.2) * (dist2 + 100);
                    const dy = Math.sin(angle + (Math.random() - 0.5) * 1.2) * (dist2 + 100) + 180;
                    petal.style.setProperty('--bx', bx + 'px');
                    petal.style.setProperty('--by', by + 'px');
                    petal.style.setProperty('--cx', cx + 'px');
                    petal.style.setProperty('--cy', cy + 'px');
                    petal.style.setProperty('--dx', dx + 'px');
                    petal.style.setProperty('--dy', dy + 'px');
                    petal.style.setProperty('--br', (Math.random() * 360) + 'deg');
                    petal.style.setProperty('--cr', (Math.random() * 540) + 'deg');
                    petal.style.setProperty('--dr', (Math.random() * 720 + 180) + 'deg');
                    petal.style.setProperty('--burst-dur', (1.2 + Math.random() * 1.8) + 's');
                    petal.style.setProperty('--burst-ease',
                        'cubic-bezier(' + (0.05 + Math.random() * 0.15) + ', ' + (0.7 + Math.random() * 0.25) +
                        ', ' + (0.2 + Math.random() * 0.3) + ', ' + (0.9 + Math.random() * 0.1) + ')');
                    document.body.appendChild(petal);
                    burstPetals.push(petal);
                    petal.addEventListener('animationend', () => {
                        petal.remove();
                        burstPetals = burstPetals.filter(p => p !== petal);
                    });
                }
            }

            function goToPage2() {
                if (isPage2Active) return;
                isPage2Active = true;
                const btnRect = nextBtn.getBoundingClientRect();
                const cx = btnRect.left + btnRect.width / 2;
                const cy = btnRect.top + btnRect.height / 2;
                burstPetalsEffect(cx, cy);
                setTimeout(() => {
                    page1.classList.add('hidden');
                    page2.classList.add('active');
                    const lines2 = [
                        '之前每次回家，',
                        '你总是给我们做一桌子爱吃的饭。',
                        '待在你身边，家里永远温暖踏实，',
                        '什么事都不用我操心，',
                        '什么麻烦都不用我扛。',
                        '从你生病之后，我才知道，',
                        '原来一直都是你在默默撑起这个家，',
                        '默默为我们遮风挡雨。',
                        '看着你生病难受，',
                        '我才格外心疼。',
                        '以后换我多照顾你、多心疼你，',
                        '你只管放宽心好好休养。',
                    ];
                    typeTextLines(page2Text, lines2, 400, () => {
                        page2Signature.classList.add('show');
                        backHint.classList.add('show');
                    });
                    setTimeout(() => {
                        const pcx = window.innerWidth / 2;
                        const pcy = window.innerHeight / 2;
                        burstPetalsEffect(pcx, pcy);
                    }, 600);
                }, 300);
            }
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                goToPage2();
            });

            backHint.addEventListener('click', () => {
                if (!isPage2Active) return;
                isPage2Active = false;
                page2.classList.remove('active');
                page1.classList.remove('hidden');
                page2Text.innerHTML = '';
                page2Signature.classList.remove('show');
                backHint.classList.remove('show');
                burstPetals.forEach(p => p.remove());
                burstPetals = [];
                cardInside.scrollTop = 0;
                if (insideText.textContent.trim() === '' || insideText.querySelectorAll('.typed-line').length ===
                    0) {
                    const insideLines = [
                        '母亲节快乐，亲爱的妈妈。',
                        '这一年你生病辛苦了，',
                        '谢谢你一直那么坚强，',
                        '哪怕自己难受，也总想着不让我们担心。',
                        '谢谢你一直毫无保留地爱我和王梓琪、',
                        '包容我们，把最好的都留给我们。',
                        '希望你往后都平平安安的，',
                        '不用总操心家里和我们的事，',
                        '每天轻松自在、开开心心，',
                        '一定要好好爱自己。',
                        '你陪我慢慢长大，',
                        '我陪你慢慢变老，',
                        '永远爱你。',
                    ];
                    typeTextLines(insideText, insideLines, 300, () => {
                        if (nextBtn.style.display === 'none' || nextBtn.style.opacity === '0') {
                            nextBtn.style.display = 'flex';
                            nextBtn.style.opacity = '1';
                        }
                    });
                }
            });

            setTimeout(() => {
                bouquetOnCover.style.animation = 'none';
                bouquetOnCover.offsetHeight;
                bouquetOnCover.style.animation = 'bouquetFloat 3.5s ease-in-out infinite';
                bouquetOnCover.style.transition = 'transform 0.3s ease';
            }, 1500);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!isCardOpen) openCard();
                    else if (!isPage2Active && nextBtn.style.display !== 'none') goToPage2();
                }
                if (e.key === 'Escape' && isPage2Active) {
                    backHint.click();
                }
                if (e.key === 'm' || e.key === 'M') {
                    toggleMusic(e);
                }
            });

            cardCover.addEventListener('dblclick', (e) => {
                e.preventDefault();
                if (!isCardOpen) openCard();
            });

            console.log('🌷 母亲节贺卡已就绪 - 文字已更新');
            console.log('   💌 点击贺卡封面打开');
            console.log('   🎵 右上角控制音乐');
            console.log('   ⌨️ 按空格键打开贺卡');
            console.log('   📱 适配手机/平板/电脑');
            console.log('   💖 祝所有妈妈母亲节快乐！');
        })();
    </script>
</body>
</html>
