<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>母亲节快乐</title>
<style>
  /* ----------------- 基础样式 ----------------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Georgia', serif; background: #fff0f5; }

  /* ----------------- 背景动画容器 ----------------- */
  #animation-layer { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  /* ----------------- 贺卡样式 ----------------- */
  #card {
    position: absolute;
    top:50%; left:50%;
    width: 300px; max-width: 90%;
    transform: translate(-50%, -50%) scale(1);
    perspective: 1000px;
    cursor: pointer;
    z-index:1;
  }
  .card-front, .card-back {
    width: 100%; height: 400px; border-radius: 20px;
    background: linear-gradient(145deg, #ffe4e1, #fffaf0);
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    position: absolute; top:0; left:0;
    backface-visibility: hidden;
    display: flex; justify-content:center; align-items:center; flex-direction:column;
    transition: transform 1s ease;
  }
  .card-back {
    transform: rotateY(180deg);
    padding: 20px;
    text-align: center;
    font-size: 1.1rem;
    color: #333;
    line-height: 1.5;
  }
  #card.open .card-front { transform: rotateY(-180deg); }
  #card.open .card-back { transform: rotateY(0deg); }

  /* ----------------- 按钮样式 ----------------- */
  #next-page {
    margin-top: 20px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="28" fill="%23ffc0cb"/><path d="M20 30 L40 30 M30 20 L30 40" stroke="%23fff" stroke-width="3" stroke-linecap="round"/></svg>') no-repeat center;
    width:60px; height:60px; border:none; border-radius:50%; cursor:pointer;
    background-size: cover;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  /* ----------------- 母亲节文字动画 ----------------- */
  .typing {
    display: inline-block;
    opacity: 0;
    animation: fadeIn 2s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ----------------- 花瓣、爱心、星星动画 ----------------- */
  .falling {
    position: fixed;
    top: -50px;
    font-size: 20px;
    z-index: 0;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* ----------------- 下一页文字容器 ----------------- */
  #page2 { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:#fffaf0; text-align:center; padding-top:50px; z-index:1; }

  #page2 h1 {
    font-size:2rem; color:#ff69b4; text-shadow: 0 0 8px rgba(255,105,180,0.7); opacity:0;
  }
</style>
</head>
<body>

<!-- 背景动画层 -->
<div id="animation-layer"></div>

<!-- 背景音乐 -->
<audio id="bgm" src="https://cdn.pixabay.com/download/audio/2023/03/15/audio_1f1b9a8b3d.mp3?filename=relaxing-piano-10745.mp3" autoplay loop></audio>
<button onclick="document.getElementById('bgm').muted = !document.getElementById('bgm').muted" style="position:fixed; top:10px; right:10px; z-index:2;">🔈</button>

<!-- 贺卡 -->
<div id="card">
  <div class="card-front">
    <img src="https://cdn.pixabay.com/photo/2016/03/31/19/29/carnation-1290509_1280.png" alt="康乃馨" style="width:150px;">
    <p style="margin-top:15px; color:#ff69b4;">点击打开贺卡</p>
  </div>
  <div class="card-back">
    <div id="card-text"></div>
    <img src="https://cdn.pixabay.com/photo/2017/01/10/19/05/mother-1966347_1280.png" alt="母亲节插图" style="width:120px; margin-top:20px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.2);">
    <button id="next-page"></button>
  </div>
</div>

<!-- 第二页 -->
<div id="page2">
  <h1 id="page2-text">愿妈妈永远快乐健康，笑容如花！</h1>
</div>

<script>
  // ----------------- 贺卡展开逻辑 -----------------
  const card = document.getElementById('card');
  const cardText = document.getElementById('card-text');
  const messages = [
    "亲爱的妈妈，母亲节快乐！",
    "感谢您无私的爱与陪伴，",
    "愿您的每一天都充满温暖与阳光。",
    "爱您，永远爱您！"
  ];
  card.addEventListener('click', () => {
    if(!card.classList.contains('open')){
      card.classList.add('open');
      let i=0;
      const interval = setInterval(()=>{
        if(i<messages.length){
          const p = document.createElement('p');
          p.className='typing';
          p.style.animationDelay = (i*1)+'s';
          p.textContent = messages[i];
          cardText.appendChild(p);
          i++;
        } else clearInterval(interval);
      },500);
    }
  });

  // ----------------- 下一页逻辑 -----------------
  const nextBtn = document.getElementById('next-page');
  const page2 = document.getElementById('page2');
  const page2Text = document.getElementById('page2-text');

  nextBtn.addEventListener('click', () => {
    page2.style.display = 'block';
    let opacity=0;
    const fadeIn = setInterval(()=>{
      opacity += 0.02;
      page2Text.style.opacity = opacity;
      if(opacity>=1) clearInterval(fadeIn);
    },50);
    spawnFlowers();
  });

  // ----------------- 背景漂浮动画 -----------------
  const animationLayer = document.getElementById('animation-layer');

  function createFallingElement(char, color, size, duration, left){
    const elem = document.createElement('div');
    elem.className='falling';
    elem.style.left = left + 'px';
    elem.style.fontSize = size + 'px';
    elem.style.color = color;
    elem.style.animationDuration = duration + 's';
    elem.textContent = char;
    animationLayer.appendChild(elem);
    setTimeout(()=>{ animationLayer.removeChild(elem); }, duration*1000);
  }

  function spawnFlowers(){
    for(let i=0;i<50;i++){
      const left = Math.random()*window.innerWidth;
      const size = 20 + Math.random()*20;
      const duration = 5 + Math.random()*5;
      const colors = ['#ff69b4','#ffc0cb','#ffe4e1','#fff0f5','#ffb6c1'];
      createFallingElement('🌸', colors[Math.floor(Math.random()*colors.length)], size, duration, left);
    }
  }

  // 持续飘落爱心、花瓣
