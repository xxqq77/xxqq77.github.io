<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母亲节快乐 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e0, #fff0f5, #ffe4ec);
            font-family: "微软雅黑", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 爱心飘落动画 */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff6b9d;
            transform: rotate(45deg);
            animation: fall linear infinite;
            opacity: 0.7;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff6b9d;
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; right: -10px; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(45deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.7; }
            100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
        }

        /* 主标题动画 */
        .title {
            font-size: 4.5vw;
            color: #c8104c;
            text-shadow: 0 0 15px #ff8fb3;
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
            text-align: center;
        }
        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        .sub-text {
            font-size: 2vw;
            color: #802440;
            margin: 10px 0;
            text-align: center;
            animation: fadeUp 3s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blessing {
            margin-top: 30px;
            font-size: 2.2vw;
            color: #b31d4d;
            text-align: center;
            line-height: 1.8;
            padding: 0 10%;
        }
    </style>
</head>
<body>
    <h1 class="title">母亲节快乐 💕</h1>
    <p class="sub-text">致我最爱的妈妈</p>
    <div class="blessing">
        感谢您岁岁年年的守护<br>
        愿时光温柔，平安喜乐，健康无忧<br>
        妈妈，我爱您！
    </div>

    <script>
        // 自动生成飘落爱心
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHeart, 200);
    </script>
</body>
</html>
